services:
  - type: web
    name: priorauth-copilot-api
    runtime: python
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn priorauth.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PRIORAUTH_MODEL
        value: claude-sonnet-5
      - key: PRIORAUTH_CACHE
        value: "1"
